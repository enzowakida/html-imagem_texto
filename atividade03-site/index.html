<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade03-site</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="img/Imagem3.png" alt="Logo"> <!-- Pode usar qualquer imagem salva na pasta img/ -->
        </div>

        <!-- ESTRUTURA DO MENU -->
        <nav class="menu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Flavors</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

    </header>

    <section class="secao-sobre">
        <!-- Aqui dentro vamos colocar a caixa da imagem e a caixa de texto -->

        <!-- Caixa do Texto -->
        <div class="caixa-texto">
            <img src="img/Captura de tela 2026-10-09 154636.png" alt="">

            <h2>From Orchard to Glass, Taste Nature's
                Finest. Revitalize Your Life with Fresh Juices,
                Every Day.
            </h2>

            <div class="juice">
                <img src="img/juice1.png" alt="um">
                <img src="img/juice2.png" alt="dois">
                <img src="img/juice3.png" alt="tres">
                <img src="img/juice4.png" alt="quatro">
            </div>
        </div>

        <!-- Caixa da Imagem -->
        <div class="caixa-imagem">
            <!-- Salve uma imagem na pasta img e coloque o nome dela aqui embaixo: -->
            <img src="img/Imagem4.png" alt="Imagem do nosso projeto">

        </div>

    </section>

    <script src="js/script.js"></script>
</body>

</html>
